name: Run OAS Generated Tests

on:
  push:
    branches:
      - test
    paths:
      - 'tests/oas-tests-agent/**'
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Optional path to test_suite.py on the test branch (leave blank to run latest pushed suite)'
        required: false
        default: ''

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-oas-tests:
    name: Execute OAS PyTest Suite & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pytest-html

      - name: Resolve Pushed Test Suite File
        id: resolve_suite
        run: |
          INPUT_SUITE="${{ github.event.inputs.test_file }}"
          # Match any newly added or modified test_suite.py under tests/oas-tests-agent/<any_subfolder>/
          CHANGED_SUITE=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null | grep -E '^tests/oas-tests-agent/.+/test_suite\.py$' | tail -n 1 || true)

          if [ -n "$INPUT_SUITE" ] && [ -f "$INPUT_SUITE" ]; then
            TARGET_SUITE="$INPUT_SUITE"
          elif [ -n "$CHANGED_SUITE" ] && [ -f "$CHANGED_SUITE" ]; then
            TARGET_SUITE="$CHANGED_SUITE"
          else
            # Fallback: pick the latest timestamped folder's test_suite.py under tests/oas-tests-agent/
            TARGET_SUITE=$(find tests/oas-tests-agent -type f -name "test_suite.py" 2>/dev/null | sort | tail -n 1 || true)
          fi

          if [ -z "$TARGET_SUITE" ] || [ ! -f "$TARGET_SUITE" ]; then
            echo "::error::No test_suite.py found under tests/oas-tests-agent/"
            exit 1
          fi

          echo "Resolved test suite: $TARGET_SUITE"
          echo "suite_path=$TARGET_SUITE" >> "$GITHUB_OUTPUT"

      - name: Run OAS PyTest Suite
        id: pytest_run
        continue-on-error: true
        run: |
          mkdir -p test-reports
          pytest "${{ steps.resolve_suite.outputs.suite_path }}" \
            -v \
            --tb=short \
            --junitxml=test-reports/junit.xml \
            --html=test-reports/report.html \
            --self-contained-html | tee test-reports/pytest_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub Job Summary Report
        if: always()
        run: |
          python3 - << 'EOF'
          import os
          import xml.etree.ElementTree as ET

          junit_path = "test-reports/junit.xml"
          suite_path = "${{ steps.resolve_suite.outputs.suite_path }}"
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")

          if not os.path.exists(junit_path) or not summary_file:
              exit(0)

          tree = ET.parse(junit_path)
          root = tree.getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]

          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          passed = total - failures - errors - skipped
          duration = sum(float(s.attrib.get("time", 0.0)) for s in suites)

          rows = []
          for s in suites:
              for tc in s.findall("testcase"):
                  name = tc.attrib.get("name", "unknown")
                  t_sec = float(tc.attrib.get("time", 0.0))
                  fail_el = tc.find("failure")
                  err_el = tc.find("error")
                  skip_el = tc.find("skipped")
                  if fail_el is not None:
                      status = "❌ FAILED"
                      detail = (fail_el.attrib.get("message") or fail_el.text or "").splitlines()[0][:120]
                  elif err_el is not None:
                      status = "⚠️ ERROR"
                      detail = (err_el.attrib.get("message") or err_el.text or "").splitlines()[0][:120]
                  elif skip_el is not None:
                      status = "⏭️ SKIPPED"
                      detail = (skip_el.attrib.get("message") or "").splitlines()[0][:120]
                  else:
                      status = "✅ PASSED"
                      detail = "All assertions passed"
                  detail = detail.replace("|", "\\|")
                  rows.append(f"| `{name}` | {status} | {t_sec:.2f}s | {detail} |")

          pass_rate = (passed / total * 100.0) if total else 0.0
          md = [
              "## 🧪 OASVerify Automated API Test Report",
              f"**Test Suite:** `{suite_path}`  ",
              f"**Branch:** `test` | **Commit:** `${{ github.sha }}`",
              "",
              "| Metric | Count |",
              "| :--- | :---: |",
              f"| **Total Scenarios** | **{total}** |",
              f"| ✅ **Passed** | **{passed}** ({pass_rate:.1f}%) |",
              f"| ❌ **Failed** | **{failures}** |",
              f"| ⚠️ **Errors** | **{errors}** |",
              f"| ⏭️ **Skipped** | **{skipped}** |",
              f"| ⏱️ **Duration** | **{duration:.2f}s** |",
              "",
              "### 📋 Scenario Breakdown",
              "| Test Scenario | Status | Duration | Details |",
              "| :--- | :---: | :---: | :--- |",
              *rows,
          ]

          with open(summary_file, "a", encoding="utf-8") as f:
              f.write("\n".join(md) + "\n")
          EOF

      - name: Upload HTML & JUnit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oas-test-report-${{ github.run_number }}
          path: |
            test-reports/report.html
            test-reports/junit.xml
            test-reports/pytest_output.txt
          retention-days: 30

      - name: Check Test Suite Result
        if: steps.pytest_run.outputs.exit_code != '0'
        run: |
          echo "::error::One or more OAS integration tests failed. See the Job Summary and uploaded HTML report artifact for details."
          exit 1
