name: Deploy ADK Agent Backend to Non-Prod

on:
  workflow_dispatch:

env:
  PROJECT_ID: 'helloayush-prj-1'
  PROJECT_NUMBER: '253690372549'

  # Cloud Run & Vertex AI variables
  GOOGLE_CLOUD_PROJECT: 'helloayush-prj-1'
  CLOUDRUN_REGION: 'us-central1'
  GOOGLE_CLOUD_LOCATION: 'global'
  CLOUDRUN_SERVICE_NAME: 'oas-testsgen-app'
  GEMINI_MODEL: 'gemini-3.8-flash'

jobs:
  deploy-adk-nonprod:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: non-prod

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 'Install ADK'
        run: |
          pip install --upgrade pip
          pip install google-adk

      - name: 'Google Auth'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/253690372549/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'nonprod-github-action-deployer@helloayush-prj-1.iam.gserviceaccount.com'

      - name: 'Deploy with ADK'
        run: |
          echo "Starting deployment to Non-Prod..."

          gcloud run deploy $CLOUDRUN_SERVICE_NAME \
            --source . \
            --project $PROJECT_ID \
            --region $CLOUDRUN_REGION \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --session-affinity \
            --memory 1Gi \
            --no-cpu-throttling \
            --set-env-vars="GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=$GOOGLE_CLOUD_LOCATION,GEMINI_MODEL=$GEMINI_MODEL"

          gcloud run services update-traffic $CLOUDRUN_SERVICE_NAME \
            --to-latest \
            --region $CLOUDRUN_REGION \
            --project $PROJECT_ID

          echo "Deployment Success verified."
